# Nginx : reverse proxy vers Node (port 4321)
# sudo cp deploy/nginx-tiktak.conf /etc/nginx/sites-available/tiktak
# sudo ln -s /etc/nginx/sites-available/tiktak /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# Puis HTTPS : sudo certbot --nginx -d tiktak.mondomaine.fr
server {
    listen 80;
    server_name tiktak.mondomaine.fr;   # <-- remplacer par votre domaine

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
